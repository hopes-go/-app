<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#d92f7d" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" />
  <title>Hope's & Go Partner Orders</title>
  <link rel="stylesheet" href="restaurant-demo.css" />
</head>
<body>
  <section class="terminal-login" id="terminalLogin">
    <form class="login-card" id="terminalLoginForm">
      <img src="assets/logo.png" alt="Hope's & Go" />
      <p class="eyebrow">Partner order tablet</p>
      <h1>Restaurant Login</h1>
      <p>Use the tablet username and PIN provided by Hope's &amp; Go.</p>
      <label>Restaurant username<input id="terminalUsername" type="text" autocomplete="off" autocapitalize="none" required /></label>
      <label>Tablet PIN<input id="terminalPin" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="off" required /></label>
      <button class="primary" type="submit">Open my orders</button>
      <p class="login-status" id="terminalLoginStatus" role="alert"></p>
      <small>Restricted restaurant access — orders only.</small>
    </form>
  </section>

  <div id="terminalApp" hidden>
  <header class="app-header">
    <div class="brand">
      <img src="assets/logo.png" alt="Hope's & Go" />
      <div><span id="restaurantName">Partner Restaurant</span><strong>Incoming Orders</strong></div>
    </div>
    <div class="demo-pill">RESTAURANT ONLY</div>
  </header>

  <main>
    <section class="summary" aria-label="Order summary">
      <article><strong id="incomingCount">1</strong><span>Incoming</span></article>
      <article><strong id="preparingCount">0</strong><span>Preparing</span></article>
      <article><strong id="readyCount">0</strong><span>Ready</span></article>
    </section>

    <section class="toolbar">
      <div><p>Hope's &amp; Go partner tablet</p><h1>Orders</h1></div>
      <div class="toolbar-actions"><button id="refreshOrders" type="button">Refresh</button><button id="terminalLogout" type="button">Log out</button></div>
    </section>

    <div id="orderList" class="order-list" aria-live="polite"></div>
  </main>
  </div>

  <div class="modal-backdrop" id="orderDialog" hidden>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <form id="orderForm">
      <button class="close-button" id="closeDialog" type="button" aria-label="Close">×</button>
      <p class="eyebrow" id="dialogEyebrow">Incoming order</p>
      <h2 id="dialogTitle">Order</h2>
      <div id="dialogBody"></div>
    </form>
    </section>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="restaurant-demo.js"></script>
</body>
</html>
